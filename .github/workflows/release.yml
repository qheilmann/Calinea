name: Release

on:
  push:
    tags:
      - '[0-9]*' # also matches pre-release/build-metadata suffixes, e.g. 0.8.0-rc.1, 0.8.0+build.5

permissions:
  contents: write

jobs:
  build-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      
      - name: Build Generator JAR
        run: |
          ./gradlew :calinea-generator:shadowJar
      
      - name: Upload Generator to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: calinea-generator/build/libs/calinea-generator-*.jar
