name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      
      - name: Build Generator JAR
        run: |
          chmod +x ./gradlew
          ./gradlew :calinea-generator:shadowJar
      
      - name: Upload Generator to Release
        uses: softprops/action-gh-release@v3
        with:
          files: calinea-generator/build/libs/calinea-generator-*.jar
